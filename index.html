<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #7b2ff7, #f107a3);
        }

        .login-container {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7b2ff7, #f107a3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        .input-box {
            position: relative;
        }

        .input-box input {
            width: 100%;
            padding: 13px 42px 13px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .input-box input:focus {
            border-color: #8b3dff;
            box-shadow: 0 0 0 3px rgba(139, 61, 255, 0.12);
        }

        .eye {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #777;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5px 0 20px;
            font-size: 13px;
        }

        .remember {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .forgot {
            color: #7b2ff7;
            text-decoration: none;
            font-weight: bold;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #7b2ff7, #f107a3);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(123, 47, 247, 0.3);
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        .signup {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #666;
        }

        .signup a {
            color: #7b2ff7;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 450px) {
            .login-container {
                width: 90%;
                padding: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">L</div>

        <h2>Welcome Back!</h2>
        <p class="subtitle">Login to your account</p>

        <form id="loginForm">

            <div class="input-group">
                <label for="email">Email Address</label>

                <div class="input-box">
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>

                <div class="input-box">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <span class="eye" id="togglePassword">👁</span>
                </div>
            </div>

            <div class="options">

                <label class="remember">
                    <input type="checkbox" id="remember">
                    Remember me
                </label>

                <a href="#" class="forgot">
                    Forgot Password?
                </a>

            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

            <div class="message" id="message"></div>

        </form>

        <div class="signup">
            Don't have an account?
            <a href="#">Sign Up</a>
        </div>

    </div>


    <script>

        // Show / Hide Password
        const togglePassword =
            document.getElementById("togglePassword");

        const password =
            document.getElementById("password");

        togglePassword.addEventListener("click", function () {

            if (password.type === "password") {
                password.type = "text";
                togglePassword.textContent = "🙈";
            } else {
                password.type = "password";
                togglePassword.textContent = "👁";
            }

        });


        // Login Validation
        const loginForm =
            document.getElementById("loginForm");

        const message =
            document.getElementById("message");

        loginForm.addEventListener("submit", function (event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const passwordValue =
                document.getElementById("password").value;

            if (email === "" || passwordValue === "") {

                message.style.color = "red";
                message.textContent =
                    "Please fill all fields.";

                return;
            }

            if (passwordValue.length < 6) {

                message.style.color = "red";
                message.textContent =
                    "Password must be at least 6 characters.";

                return;
            }

            message.style.color = "green";
            message.textContent =
                "Login successful!";

        });

    </script>

</body>
</html>
